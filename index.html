<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Directorio METGA Ops</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="icon" type="image/png" href="./logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-slate-700">
      <div class="text-center mb-6">
        <img src="./logo.png" alt="METGA Logo" class="h-12 w-auto mx-auto mb-3 object-contain">
        <h2 class="text-xl font-bold text-slate-800">Acceso a METGA Ops</h2>
        <p class="text-xs text-slate-500 mt-1">Ingresa tus credenciales autorizadas</p>
      </div>

      <form onsubmit="iniciarSesion(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Usuario</label>
          <input type="text" id="userInput" required placeholder="Ej: Mquesada" 
                 class="w-full p-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-slate-50">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
          <input type="password" id="passInput" required placeholder="Ingresa tu contraseña" 
                 class="w-full p-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-slate-50">
        </div>

        <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200 text-center"></div>

        <button type="submit" id="btnLogin" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition flex items-center justify-center gap-2 text-sm">
          <span>Ingresar</span>
        </button>
      </form>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL DE LA APP -->
  <div id="appScreen" class="hidden">
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 shadow-md">
      <div class="max-w-md mx-auto flex justify-between items-center">
        <div class="flex items-center gap-3">
          <img src="./logo.png" alt="METGA Logo" class="h-9 w-auto object-contain rounded bg-white/10 p-1">
          <div>
            <h1 class="font-bold text-base leading-tight">Directorio Ops</h1>
            <p id="userGreeting" class="text-[11px] text-slate-400">Cargando...</p>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="cargarDatos()" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-2 rounded-lg border border-slate-700 active:scale-95 transition">
            🔄
          </button>
          <button onclick="cerrarSesion()" title="Cerrar Sesión" class="bg-red-900/60 hover:bg-red-800 text-xs px-2.5 py-2 rounded-lg border border-red-700/50 active:scale-95 transition text-red-200">
            🚪
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-12">
      <!-- BANNER DE INSTALACIÓN PWA -->
      <div id="installBanner" class="hidden mb-4 bg-gradient-to-r from-blue-900 to-slate-900 text-white p-4 rounded-2xl shadow-lg border border-blue-700 flex justify-between items-center animate-bounce">
        <div class="pr-2">
          <p class="font-bold text-xs">📱 ¡Instala la App en tu celular!</p>
          <p class="text-[11px] text-blue-200 mt-0.5">Accede rápido desde tu pantalla principal</p>
        </div>
        <button onclick="instalarPWA()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow border border-blue-400 active:scale-95 transition flex-shrink-0">
          Instalar
        </button>
      </div>

      <div class="relative mb-4">
        <input type="text" id="searchInput" onkeyup="filtrar()" placeholder="Buscar por nombre o unidad (ej: TR-020)..." 
               class="w-full p-3.5 pl-10 rounded-xl border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white text-sm">
        <span class="absolute left-3.5 top-3.5 text-slate-400">🔍</span>
      </div>

      <div class="flex justify-between items-center mb-3 text-xs text-slate-500 px-1">
        <span id="contador">Cargando...</span>
        <span id="status" class="text-emerald-600 font-medium">● Conectado</span>
      </div>

      <div id="listaOperadores" class="space-y-3">
        <div class="bg-white p-6 rounded-xl text-center shadow-sm border border-slate-200">
          <div class="animate-spin inline-block w-6 h-6 border-2 border-current border-t-transparent text-blue-600 rounded-full mb-2"></div>
          <p class="text-sm text-slate-500">Cargando directorio...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxuD12ZCqRoQwPi4i3PWMIETov01XZVYa52Z1syKbug6QSfwpvr2KpL2r4a6I-QJ18/exec"; 

    let operadores = [];
    let deferredPrompt = null;

    // Capturar evento de instalación del navegador
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("metga_user");
      if (savedUser) {
        mostrarApp(savedUser);
      }
    });

    async function iniciarSesion(e) {
      e.preventDefault();
      const user = document.getElementById("userInput").value.trim();
      const pass = document.getElementById("passInput").value.trim();
      const errorDiv = document.getElementById("loginError");
      const btn = document.getElementById("btnLogin");

      errorDiv.classList.add("hidden");
      btn.disabled = true;
      btn.innerHTML = `<span>Validando...</span>`;

      try {
        const res = await fetch(`${API_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
        const data = await res.json();

        if (data.success) {
          localStorage.setItem("metga_user", data.nombre);
          mostrarApp(data.nombre);
        } else {
          errorDiv.innerText = data.message || "Credenciales incorrectas";
          errorDiv.classList.remove("hidden");
        }
      } catch (err) {
        errorDiv.innerText = "Error de conexión. Verifica tu acceso a internet.";
        errorDiv.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Ingresar</span>`;
      }
    }

    function mostrarApp(nombreUsuario) {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("appScreen").classList.remove("hidden");
      document.getElementById("userGreeting").innerText = `Hola, ${nombreUsuario}`;
      
      if (deferredPrompt) {
        document.getElementById("installBanner").classList.remove("hidden");
      }

      cargarDatos();
    }

    async function instalarPWA() {
      if (!deferredPrompt) return;
      
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      
      if (outcome === 'accepted') {
        document.getElementById("installBanner").classList.add("hidden");
      }
      deferredPrompt = null;
    }

    function cerrarSesion() {
      localStorage.removeItem("metga_user");
      location.reload();
    }

    async function cargarDatos() {
      const contenedor = document.getElementById('listaOperadores');
      const contador = document.getElementById('contador');
      const status = document.getElementById('status');
      
      try {
        // Intenta obtener datos frescos de la red
        const res = await fetch(API_URL);
        operadores = await res.json();
        
        // Guarda respaldo en el almacenamiento local del teléfono
        localStorage.setItem("metga_operadores_cache", JSON.stringify(operadores));

        status.innerText = "● Conectado";
        status.className = "text-emerald-600 font-medium";
        contador.innerText = `${operadores.length} registro(s) encontrados`;
        
        renderizar(operadores);

      } catch (err) {
        // Si falla la red (sin señal/datos), carga la copia guardada
        const cachedData = localStorage.getItem("metga_operadores_cache");

        if (cachedData) {
          operadores = JSON.parse(cachedData);
          status.innerText = "⚡ Modo Sin Conexión";
          status.className = "text-amber-600 font-medium";
          contador.innerText = `${operadores.length} registro(s) (Copia Offline)`;
          renderizar(operadores);
        } else {
          contenedor.innerHTML = `
            <div class="bg-amber-50 p-4 rounded-xl text-center border border-amber-200 text-amber-700 text-sm">
              ⚠️ No hay datos guardados. Abre la app con internet al menos una vez para sincronizar.
            </div>`;
        }
      }
    }

    function renderizar(lista) {
      const contenedor = document.getElementById('listaOperadores');
      contenedor.innerHTML = '';

      if (lista.length === 0) {
        contenedor.innerHTML = `
          <div class="bg-white p-6 rounded-xl text-center text-slate-500 text-sm border border-slate-200">
            No se encontraron operadores.
          </div>`;
        return;
      }

      lista.forEach(op => {
        const tieneTel = op.telefono && op.telefono.length >= 10;
        let telWA = op.telefono;
        if (telWA && telWA.length === 10) telWA = '52' + telWA;

        contenedor.innerHTML += `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div class="pr-2 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="bg-blue-100 text-blue-800 text-[11px] font-bold px-2 py-0.5 rounded-md border border-blue-200">
                  ${op.unidad || 'S/N'}
                </span>
                <span class="text-xs font-semibold text-slate-500 truncate">${op.categoria || op.puesto}</span>
              </div>
              <h2 class="font-bold text-slate-800 text-sm truncate">${op.nombre}</h2>
              <p class="text-xs text-slate-500 mt-0.5">${tieneTel ? op.telefono : '⚠️ Sin teléfono asignado'}</p>
            </div>

            <div class="flex gap-2 flex-shrink-0">
              ${tieneTel ? `
                <a href="tel:${op.telefono}" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-sm">
                  📞
                </a>
                <a href="https://wa.me/${telWA}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-sm">
                  💬
                </a>
              ` : `
                <span class="bg-slate-100 text-slate-400 w-10 h-10 rounded-xl flex items-center justify-center text-xs">
                  N/A
                </span>
              `}
            </div>
          </div>
        `;
      });
    }

    function filtrar() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtrados = operadores.filter(op => 
        op.nombre.toLowerCase().includes(q) || 
        op.unidad.toLowerCase().includes(q) ||
        op.puesto.toLowerCase().includes(q)
      );
      document.getElementById('contador').innerText = `${filtrados.length} resultado(s)`;
      renderizar(filtrados);
    }
  </script>
</body>
</html>
